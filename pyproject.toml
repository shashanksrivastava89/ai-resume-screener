[project]
name = "resume-screener"
version = "0.1.0"
description = "Resume Screener — two-layer, jurisdiction-aware shortlisting engine with a FastAPI + React review UI (PoC / production seed)"
requires-python = ">=3.11"
dependencies = [
    "azure-identity>=1.27.0",
    "azure-keyvault-secrets>=4.12.0",
    "cryptography>=50.0.2",  # decision verdicts encrypted at rest (fieldcrypto); >=50: PYSEC-2026-3552
    "azure-ai-documentintelligence>=1.0.0",
    "python-docx>=1.1",
    "pypdf>=6.19",  # parses hostile uploads (pdfsafe): >=6.19 for the 2026 advisories
    "openai>=1.55",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "fastapi>=0.165.0",
    "uvicorn[standard]>=0.30",
    "mcp>=1.30,<2",  # >=1.30: CVE-2026-59951
    "python-multipart>=0.0.34",
    "sqlalchemy>=2.1.9",
    "alembic>=1.20.1",
    "psycopg[binary]>=3.2",
    "numpy>=1.26",
    "pandas>=3.1.1",
    "openpyxl>=3.1",
    "pillow>=10.4",
    "typer>=0.29.2",
    "portalocker>=2.8",
    "pyyaml>=6.0.4",
    "ruamel-yaml>=0.18",
    "tenacity>=9.2.1",
    "tqdm>=4.70.1",
    "rich>=13.7",
]

[project.scripts]
screener = "resume_screener.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resume_screener"]
