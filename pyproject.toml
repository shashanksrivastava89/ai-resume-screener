[project]
name = "resume-screener"
version = "0.1.0"
description = "Resume Screener — two-layer, jurisdiction-aware shortlisting engine with a FastAPI + React review UI (PoC / production seed)"
requires-python = ">=3.11"
dependencies = [
    "azure-identity>=1.17",
    "azure-keyvault-secrets>=4.8",
    "cryptography>=50",  # decision verdicts encrypted at rest (fieldcrypto); >=50: PYSEC-2026-3552
    "azure-ai-documentintelligence>=1.0.0",
    "python-docx>=1.1",
    "pypdf>=6.19",  # parses hostile uploads (pdfsafe): >=6.19 for the 2026 advisories
    "openai>=1.55",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "mcp>=2.3.0,<3",  # >=1.30: CVE-2026-59951
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "numpy>=1.26",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "pillow>=10.4",
    "typer>=0.12",
    "portalocker>=2.8",
    "pyyaml>=6.0",
    "ruamel-yaml>=0.18",
    "tenacity>=8.4",
    "tqdm>=4.66",
    "rich>=13.7",
]

[project.scripts]
screener = "resume_screener.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resume_screener"]
