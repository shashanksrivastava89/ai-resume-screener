# Reference geography for the NON-SCORING location lens (2026-08-26).
#
# ⚠ THIS IS NOT A SCORING ARTIFACT. Nothing in this file can move a candidate's score.
# It sits beside signals/ for one reason only — signals/ is seeded into DATA_ROOT, so a
# hosted deployment can correct a wrong or missing city by editing a file on the share
# instead of waiting for a release. It carries no version, needs no approval, and is
# deliberately absent from the governed scoring model: `commute_or_address` is a FLOOR
# never-scored topic (CLAUDE.md §6.6), so distance is recruiter CONTEXT and a Review
# filter, never a weight, a gate or a band.
#
# WHY A TABLE RATHER THAN A GEOCODING SERVICE. Azure Maps would be more accurate and
# global, but it would send candidate location text to an external service — a privacy
# decision that belongs to HR and Legal, not to an implementation. A local table keeps
# every candidate's stated location inside the tenant, and makes the distance
# DETERMINISTIC and replayable, which is the same property Layer 1 guarantees: the same
# résumé and the same requisition always produce the same number, and anyone can check
# the arithmetic.
#
# PRECISION. Coordinates are approximate city-centre points at 2 decimal places (~1 km).
# That is the right resolution for "is this candidate plausibly local?" and the wrong
# resolution for anything else — the UI always renders these as "≈ N km" for that reason.
# Distances are great-circle (haversine), so they are shorter than a road route.
#
# COVERAGE IS THE POINT OF FAILURE, AND IT FAILS SAFE. A place that is not in this table
# resolves to "distance unknown", which is never treated as "far away" and never filters
# anyone out. Adding a city is one entry; nothing else changes.
#
# `aliases` covers renames and common spellings, which is the likeliest source of a false
# "unknown" in the Indian pilot (Gurgaon/Gurugram, Bombay/Mumbai, Bangalore/Bengaluru).
#
# `sweep: false` keeps a name out of the LAST-RESORT scan of the résumé body while
# leaving it fully usable as a job location and on an explicit "Location: …" line. It is
# for names that are also ordinary words or personal names — see the rules above the
# "OUTSIDE INDIA" section.
#
# THIS FILE IS MERGED WITH THE ONE IN THE BUILD. DATA_ROOT seeds a copy on first run and
# never overwrites it, so the shipped table is the floor and entries here are laid over
# it by name: a release can add cities without touching the share, and a correction made
# here survives every release.

