  # ===================================================================================
  # OUTSIDE INDIA
  #
  # This section used to hold eight cities and said "kept short on purpose … not as
  # real coverage". A pilot requisition for BUDAPEST then read as "distance unknown"
  # on every candidate (2026-09-11), which looks like a broken filter rather than a
  # missing row — the job's own city was the unresolvable side, and no candidate could
  # ever match. A requisition may be raised anywhere the company hires, so the table
  # now covers the places one plausibly is.
  #
  # TWO RULES FOR ADDING A CITY:
  #  1. A name that is also an ordinary English word or a common personal name
  #     ("Nice", "Austin", "Phoenix", "Reading") must carry `sweep: false`. It stays
  #     fully usable as a job location and on an explicit "Location: Austin" line, but
  #     it is kept out of the last-resort sweep of the résumé body, where a bare word
  #     in prose would otherwise be read as somebody's home town. A confidently wrong
  #     city is worse than an honest "unknown".
  #  2. Never add two cities with the same name (Cambridge, Birmingham). The first
  #     entry wins, so the loser's residents would be reported thousands of km from
  #     where they live. Leave the ambiguous one out; "unknown" is the honest answer.
  # ===================================================================================

