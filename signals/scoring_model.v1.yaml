# The scoring model, v1 — every number and rule that shapes a score, in ONE
# governed, versioned artifact. Owned by policy makers (HR Head / Legal / Super
# Admin), not developers: edits become change proposals a second leader approves;
# each publish writes a NEW scoring_model.v{N}.yaml (this file is immutable).
#
# Merged here 2026-07-18 (design-led rebuild): the AI-signal registry (formerly
# signals/registry.yaml) and the never-scored topics (formerly its `excluded:`
# list, now with trigger phrases + enforcement stages). WHICH signals apply to a
# given run, and their final caps/params, is still decided by the jurisdiction
# policy pack (policies/) — enablement here is only the default.

version: 1

# ── Bands & bounds ────────────────────────────────────────────────────────────
# The last step of the sequence: where the labels sit on the scale, and the
# fence the final number can never leave.
bands:
  strong_at: 88.0        # calibrated 75 -> 88 on the 2026-07-06 pilot runs
  possible_at: 60.0      # calibrated 50 -> 60 on the 2026-07-06 pilot runs
  cap_if_must_have_missing: Possible
clamp:
  min: 0.0
  max: 100.0

# ── Evidence credits ──────────────────────────────────────────────────────────
# Clear evidence pays a checklist line's full weight, partial pays half, none
# pays nothing — summed into the base, out of 100. No AI anywhere in this part.
coverage:
  match_value:
    full: 1.0
    partial: 0.5
    none: 0.0

# ── AI signals — global bounds ───────────────────────────────────────────────
adjustments:
  total_cap_points: 8.0  # all signals together can move a score at most this far

# ── Preference nudges ─────────────────────────────────────────────────────────
preferences:
  per_preference_cap_points: 2.0
  review_months: 6

# ── Confidence read (display only — never changes a score) ────────────────────
confidence:
  unmeasured_extraction_value: 0.85
  high_requires_at_least: 0.9
  low_below: 0.75
  low_when_downgraded_findings_over: 2

# ── AI signals ────────────────────────────────────────────────────────────────
# One entry per thing the AI model may reward or subtract — always with a résumé
# quote, a hard cap and a direction. Descriptions appear in the recruiter UI as
# written; job_relatedness is the first thing Legal reads.
signals:
  - id: quota_attainment_evidence
    display_name: Quota attainment (sales)
    description: >-
      (Sales) Concrete, verifiable attainment stated in the resume — e.g. "112% of
      ₹6 Cr FY24 target", President's Club, ranked finishes. Vague "exceeded targets"
      claims earn little or nothing.
    kind: judged
    direction: plus
    cap_points: 5
    enabled_default: true
    job_relatedness: >-
      Documented quota attainment is the most direct evidence of sales capability;
      evidence-only and capped to resist resume inflation.

  - id: regulated_environment_exposure
    display_name: Regulated environment
    description: >-
      Evidence of having worked under the compliance regimes this role touches — for
      India Finance e.g. GST/TDS filings, Ind AS, Companies Act, SOX controls,
      RBI/SEBI-regulated processes, statutory audits.
    kind: judged
    direction: plus
    cap_points: 4
    enabled_default: true
    job_relatedness: >-
      Roles operating under these regimes need people who have actually run the filings
      and controls; errors there are costly and audited.

  - id: deal_profile_fit
    display_name: Deal profile fit (sales)
    description: >-
      (Sales) Match between the deals the candidate has actually run — ticket size,
      cycle length, motion (field/inside, channel/direct, SMB/enterprise) — and this
      role's deal profile. Can add or subtract within its cap.
    kind: judged
    direction: both
    cap_points: 4
    enabled_default: true
    job_relatedness: >-
      Selling motion transfers poorly across very different deal profiles; closeness
      predicts ramp speed in the territory.

  - id: tenure_pattern_vs_stability
    display_name: Tenure pattern
    description: >-
      How long the candidate tends to stay in permanent jobs. Rewards a track record of
      completed stints; can subtract for many very short permanent stints in a row.
      Contract, consulting and internship roles never count against anyone. What counts
      as "short" comes from the jurisdiction policy — Indian sales norms differ from
      Japanese ones.
    kind: computed
    direction: both
    cap_points: 4
    enabled_default: true
    job_relatedness: >-
      Ramp-up in finance and sales roles takes months; sustained stints predict staying
      through the role's payback period and continuity for clients and ledgers.

  - id: skill_recency
    display_name: Skill recency
    description: >-
      How recently the JD's core skills were actually used, judged from dated work
      history rather than the skills list alone. "Filed GST monthly through 2025" beats
      a skill last touched in 2016.
    kind: computed
    direction: both
    cap_points: 3
    enabled_default: true
    job_relatedness: >-
      Recently exercised skills transfer immediately; long-dormant ones need retraining
      time the hiring team should know about.

  - id: scope_trajectory
    display_name: Scope growth
    description: >-
      Growth in evidenced responsibility over time — team size, number of entities or
      ledgers owned, territory, book of business. Only counts what the resume states;
      a flat trajectory never subtracts points.
    kind: computed
    direction: plus
    cap_points: 3
    enabled_default: true
    job_relatedness: >-
      Expanding scope is direct evidence of capacity to carry this role's responsibility
      level.

  - id: certification_currency
    display_name: Certification currency
    description: >-
      Role-relevant credentials and how current they are — for India Finance e.g.
      CA / CS / ICWA (CMA), CPA / CFA / ACCA; for markets and insurance e.g.
      NISM / AMFI / IRDAI registrations. Stale or lapsed credentials simply add less;
      they never subtract.
    kind: computed
    direction: plus
    cap_points: 3
    enabled_default: true
    job_relatedness: >-
      Current certifications evidence up-to-date knowledge that some finance tasks
      legally or practically require.

  - id: hands_on_currency
    display_name: Hands-on currency
    description: >-
      Whether the candidate still personally does the hands-on work this role needs
      (e.g. preparing reconciliations or GST returns themselves, carrying their own
      quota) versus only supervising it. Matters only when the JD is hands-on.
    kind: judged
    direction: both
    cap_points: 3
    enabled_default: true
    job_relatedness: >-
      A hands-on role needs current doing-experience; a recent pure-oversight profile
      ramps slower on the tools and details.

  - id: domain_transfer_distance
    display_name: Domain closeness
    description: >-
      How close the candidate's industry and domain sit to this role's domain, measured
      by comparing their work history with the JD. Declared as its own signal so the
      similarity math is visible and capped instead of hidden inside a blended score.
    kind: computed
    direction: both
    # Calibrated 4 -> 2 (P13): Layer 1 coverage already scores how well the work
    # history matches the JD, so a large cap here double-counts it.
    cap_points: 2
    enabled_default: true
    job_relatedness: >-
      Domain closeness predicts familiarity with the vocabulary, processes and
      regulations the role works in.

  - id: language_evidence
    display_name: Language evidence
    description: >-
      EVIDENCED working use of languages the role's territory needs — including Indian
      regional languages for field sales (e.g. "ran dealer meets in Tamil and Kannada").
      Counts only stated, work-related use. NEVER inferred from name, birthplace,
      school or address.
    kind: judged
    direction: plus
    cap_points: 2
    enabled_default: true
    job_relatedness: >-
      Field sales and customer-facing finance in multilingual territories depend on
      working language ability with customers and channel partners.

  - id: preferred_domain_background
    display_name: Preferred domain background
    description: >-
      Worked at an organization on the HR-approved list of similar or adjacent businesses
      for this role family. The list is EMPTY until HR fills it in — and with an empty
      list this signal never adds points.
    kind: judged
    direction: plus
    cap_points: 3
    enabled_default: true
    job_relatedness: >-
      Direct exposure to comparable products, customers or processes shortens onboarding.
      Only organizations HR explicitly lists may count — nothing inferred.
    notes: "HR owns the organization list (policies/*: params.organizations). Empty by design until HR provides it."

  - id: public_work_relevance
    display_name: Public work
    description: >-
      Role-relevant public work the candidate cites in their own resume (talks,
      articles, open-source). OFF for the pilot. Absence of any public profile never
      counts against anyone.
    kind: judged
    direction: plus
    cap_points: 2
    enabled_default: false
    job_relatedness: >-
      Only candidate-provided material may ever be considered (no scraping); mostly
      relevant to technical roles, not this pilot's finance and sales roles.
    notes: "Stays off until the production enrichment design (§12) is approved. Never a negative signal."

# ── Never-scored topics ───────────────────────────────────────────────────────
# Never scored, by design. The critic checks the AI's reasoning against this
# list (plus any policy-pack additions); reasons are shown in the UI as written.
# `floor: true` marks a protection treated as law-adjacent — removing one takes
# an explicit exposure acknowledgment on top of the ordinary approval.
# `stages` say WHERE each topic is enforced; `phrases` are the literal,
# precision-first text matches the deterministic code screen fires on (finance
# vocabulary like "gap analysis" must never trigger — the reviewing AI model
# catches paraphrases the phrase list can't).
topics:
  - id: employment_gaps
    name: Employment gaps
    floor: true
    reason: >-
      Gaps are life — caregiving, illness, layoffs, study, visas. Gaps are computed
      nowhere in this system and never scored.
    stages: [scoring, checklist, preferences]
    phrases:
      - employment gap
      - employment gaps
      - career gap
      - career gaps
      - work gap
      - work gaps
      - gap in employment
      - gaps in employment
      - gap in work history
      - gaps in work history
      - gap in career
      - unexplained gap
      - unexplained gaps

  - id: unemployment_status
    name: Current unemployment
    floor: true
    reason: >-
      Being currently out of work says nothing about ability, and penalizing it
      compounds disadvantage.
    stages: [scoring, checklist, preferences]
    phrases:
      - unemployed
      - unemployment
      - currently not working
      - out of work
      - between jobs

  - id: overqualification_or_age_proxies
    name: Age & its proxies
    floor: true
    reason: >-
      "Too senior", graduation years, date of birth — these are age-discrimination
      proxies. Age data is redacted before scoring anyway.
    stages: [scoring, checklist, preferences]
    phrases:
      - overqualified
      - too senior
      - too experienced
      - year old
      - years old
      - age
      - graduation year
      - date of birth
      - dob

  - id: commute_or_address
    name: Address & commute
    floor: true
    reason: >-
      Address and commute distance proxy for community and socioeconomic status.
      Addresses are redacted before scoring.
    stages: [scoring, checklist, preferences]
    phrases:
      - commute
      - commutes
      - commuting
      - home address
      - residential address
      - lives in
      - lives near
      - lives far
      - live near
      - live far

  - id: salary_history
    name: Salary history
    floor: true
    reason: >-
      Prior pay imports historic inequity and is illegal to ask about in several
      jurisdictions.
    stages: [scoring, checklist, preferences]
    phrases:
      - salary history
      - salary expectation
      - salary expectations
      - salary band
      - salary drawn
      - current salary
      - past compensation
      - current ctc
      - ctc

  - id: school_prestige_as_such
    name: School prestige as such
    floor: true
    reason: >-
      Institution brand by itself encodes access and class/caste, not ability. What was
      studied and achieved is still assessed — the brand alone is not.
    stages: [scoring, checklist, preferences]
    phrases:
      - prestigious
      - tier-1 college
      - tier 1 college
      - tier-one college
      - tier-1 institute
      - tier 1 institute
      - tier-1 university
      - tier 1 university
      - premier institute
      - iit
      - iim

  - id: culture_fit_vibes
    name: Culture fit / vibes
    floor: true
    reason: >-
      Unstructured "fit" judgments are where bias hides. Only declared, evidenced,
      capped signals may adjust scores.
    stages: [scoring, checklist, preferences, narrative]
    phrases:
      - culture fit
      - cultural fit
      - culturally aligned
      - culturally fits
      - fit with the team
      - fit into the team
      - fit with the culture
      - fit into the culture
      - vibe
      - vibes

  - id: similarity_to_current_employees
    name: Similarity to current team
    floor: true
    reason: >-
      Ranking by resemblance to the current team automates homogeneity (the Amazon
      lesson). Similarity to existing employees is never a target.
    stages: [scoring, checklist, preferences, narrative]
    phrases:
      - similar to our
      - similar to current
      - similar to existing
      - like our team
      - like our current team
      - like our employees

  - id: demographic_language
    name: Demographic language
    floor: true
    reason: >-
      Identity is removed before scoring — any demographic word in scoring reasoning
      means a leak or an inference. Set aside either way.
    stages: [scoring, narrative]
    phrases:
      - male
      - female
      - gender
      - married
      - marital
      - pregnant
      - pregnancy
      - caste
      - religion
      - nationality

# ── Recruiter-facing explainer templates ──────────────────────────────────────
# {placeholders} are filled from the values above, so on-screen copy can never
# rot against the numbers.
display:
  adjustment_cap_note: "Each factor is capped so no single one can swing a decision."
  total_cap_note: "All context notes together can move a score by at most {total_cap_points} points."
  preference_cap_note: "Each preference can move a score by at most {per_preference_cap_points} points and never hides anyone."
  review_note: "Approvals expire after {review_months} months and need a re-review."
  band_cap_note: "A candidate missing a must-have can rank no higher than \"{cap_if_must_have_missing} match\", whatever the number says."
