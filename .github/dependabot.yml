# Dependency updates (2026-10-14): weekly, minor + patch grouped per ecosystem so a
# week's bumps arrive as one pull request each, majors on their own. Every PR runs CI.
version: 2
updates:
  - package-ecosystem: uv            # pyproject.toml + uv.lock
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      web-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions  # bumps the SHA pins in .github/workflows
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker          # python/node base images and the pinned uv image
    directory: /
    schedule:
      interval: weekly
