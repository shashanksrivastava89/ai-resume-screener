# Security scans (2026-10-14): secrets, vulnerable dependencies, and static analysis.
#
# Open-source tools, because whether this organisation licenses GitHub Advanced
# Security (secret scanning, CodeQL) for private repositories is not known; if it
# does, switch those on as well — they do not replace each other. Informational:
# none of these is a required check, so a finding shows red here without blocking a
# merge while it is triaged.
#
#   secrets    TruffleHog — only VERIFIED secrets (live credentials) fail the job
#   python     pip-audit over the locked production dependencies (uv.lock)
#   sast       bandit (medium+ severity and confidence) and Semgrep's Python rules
#   web        npm audit of the production dependencies, high and critical only
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'   # Mondays 03:17 UTC — new advisories arrive without a push
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9
        with:
          extra_args: --only-verified

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: pip-audit (locked production dependencies)
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o requirements.txt
          uvx pip-audit --disable-pip --no-deps -r requirements.txt

  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: bandit
        run: uvx bandit -r src -ll -ii
      - name: semgrep
        run: uvx semgrep scan --config p/python --error --metrics off src

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - run: npm ci
        working-directory: web
      - run: npm audit --audit-level=high --omit=dev
        working-directory: web
